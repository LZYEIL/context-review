<!-- PDF-only styling (WeasyPrint). HTML output / online site are unaffected. -->
<!-- Covers: the author block, section numbering, and the injected Contents page. -->

<style>
  /* ---- Drop the "This manuscript was compiled ..." byline in the PDF ---- */
  #title-block-header + p {
    display: none;
  }

  /* ---- Author block: two per row (left-to-right, then wrap) so all authors
         fit on the title page while keeping the numbered reading order ---- */
  h2#authors + ul {
    padding-left: 0;
    list-style: none;
    overflow: hidden;   /* contain the floats */
  }
  h2#authors + ul > li {
    float: left;
    width: 50%;
    box-sizing: border-box;
    padding-right: 1.5rem;
    margin: 0 0 0.5rem 0;
    line-height: 1.3;
  }
  h2#authors + ul > li:nth-child(odd) {
    clear: left;        /* start each row cleanly, regardless of entry height */
  }
  h2#authors + ul > li > p {
    margin: 0;
  }
  /* the base theme lets links break mid-word; in a half-width column that cuts
     handles in two ("pr / obablybots"), so wrap identifier lines only at the
     "·" separators. icon-links.lua groups each icon with its handle. */
  h2#authors + ul a {
    overflow-wrap: normal;
    word-break: normal;
  }
  .nowrap {
    white-space: nowrap;
  }
  /* keep the correspondence line below the author grid, full width */
  #correspondence {
    clear: both;
  }

  /* ---- Section numbering: number content sections, skip front/back matter ---- */
  body {
    counter-reset: section;
  }
  h2:not(#authors):not(#abstract):not(#references):not(#appendix-a) {
    counter-increment: section;
  }
  h2:not(#authors):not(#abstract):not(#references):not(#appendix-a)::before {
    content: counter(section) ". ";
  }

  /* ---- Printed table of contents (injected by build/pandoc/filters/toc.lua) ---- */
  #TOC {
    page-break-before: always;
    counter-reset: tocsec;
  }
  #TOC::before {
    content: "Contents";
    display: block;
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 1rem;
  }
  #TOC ul {
    list-style: none;
    padding-left: 1rem;
    margin: 0;
  }
  #TOC > ul {
    padding-left: 0;
  }
  #TOC li {
    margin: 0.15rem 0;
    line-height: 1.4;
  }
  #TOC a {
    text-decoration: none;
    color: inherit;
  }
  /* number the same content sections in the ToC, matching the body */
  #TOC a.numbered {
    counter-increment: tocsec;
  }
  #TOC a.numbered::before {
    content: counter(tocsec) ". ";
  }
  /* dot leader + resolved page number for each entry */
  #TOC a::after {
    content: leader(". ") target-counter(attr(href url), page);
  }
</style>
