<!-- printed table of contents, PDF (WeasyPrint) only -->
<!-- The Contents block is injected by build/pandoc/filters/toc.lua as <div id="TOC">. -->

<style>
  #TOC {
    page-break-before: always;
  }
  #TOC::before {
    content: "Contents";
    display: block;
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 1rem;
  }
  #TOC ul {
    list-style: none;
    padding-left: 1rem;
    margin: 0;
  }
  #TOC > ul {
    padding-left: 0;
  }
  #TOC li {
    margin: 0.15rem 0;
    line-height: 1.4;
  }
  #TOC a {
    text-decoration: none;
    color: inherit;
  }
  /* dot leader + resolved page number for each entry */
  #TOC a::after {
    content: leader(". ") target-counter(attr(href url), page);
  }
</style>
