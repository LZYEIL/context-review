# Pandoc --defaults for PDF output via weasyprint.
# Load on top of HTML defaults.
output-file: output/manuscript.pdf
# PDF-only presentation (HTML output is unaffected): toc.lua injects a Contents
# block after the author list; pdf-styles.html styles the author block, section
# numbering, and that Contents page.
filters:
- build/pandoc/filters/toc.lua
include-in-header:
- build/themes/pdf-styles.html
pdf-engine: weasyprint
pdf-engine-opts:
- '--presentational-hints'
html-math-method:
  method: webtex
  url: 'https://latex.codecogs.com/svg.latex?'
